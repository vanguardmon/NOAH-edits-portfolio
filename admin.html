
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NOAH edits | Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #090b10;
      --panel: #141821;
      --line: #2b303b;
      --gold: #d6ad62;
      --text: #f4f4f5;
      --muted: #a6adbb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 24px;
      background: var(--bg); color: var(--text);
      font: 15px/1.5 Arial, sans-serif;
    }
    main { max-width: 950px; margin: auto; }
    h1 { margin: 0 0 4px; }
    h1 span { color: var(--gold); }
    .muted { color: var(--muted); }
    .panel {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 14px; padding: 20px; margin: 18px 0;
    }
    label { display: block; margin: 12px 0 5px; color: var(--muted); }
    input, select {
      width: 100%; padding: 12px; border-radius: 8px;
      border: 1px solid var(--line); background: #0d1016;
      color: var(--text); font-size: 15px;
    }
    button {
      padding: 10px 15px; border: 0; border-radius: 8px;
      background: var(--gold); color: #111; font-weight: 700;
      cursor: pointer; margin: 8px 5px 0 0;
    }
    button.secondary { background: #303746; color: white; }
    button.danger { background: #8d333b; color: white; }
    button:disabled { opacity: .5; cursor: wait; }
    .hidden { display: none !important; }
    .status { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 12px; }
    .video { padding: 14px 0; border-bottom: 1px solid var(--line); }
    .video:last-child { border-bottom: 0; }
    .top { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    @media (max-width: 600px) { body { padding: 12px; } }
  </style>
</head>
<body>
<main>
  <h1>NOAH <span>edits</span></h1>
  <p class="muted">Portfolio Administration</p>

  <section id="loginPanel" class="panel">
    <h2>Admin Login</h2>
    <form id="loginForm">
      <label for="email">Admin email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button id="loginButton" type="submit">Login securely</button>
    </form>
    <p id="loginStatus" class="status" role="status"></p>
  </section>

  <section id="dashboard" class="hidden">
    <div class="panel">
      <div class="top">
        <div>
          <h2>Video Projects</h2>
          <p class="muted">Signed in: <span id="adminEmail"></span></p>
        </div>
        <button id="logoutButton" class="secondary" type="button">Logout</button>
      </div>
      <p class="muted">Projects are saved in Supabase. Your public website must also read this table to show changes.</p>
    </div>

    <div class="panel">
      <h2 id="formHeading">Add a video</h2>
      <form id="videoForm">
        <input id="videoId" type="hidden">
        <label for="title">Project title</label>
        <input id="title" maxlength="120" required>
        <label for="category">Category</label>
        <select id="category" required>
          <option value="cinematic">Cinematic Edits</option>
          <option value="reels">Reels / Shorts</option>
          <option value="commercial">Commercial Ads</option>
          <option value="other">Other Projects</option>
        </select>
        <label for="youtubeUrl">YouTube video link</label>
        <input id="youtubeUrl" type="url" placeholder="https://youtu.be/..." maxlength="500" required>
        <button id="saveButton" type="submit">Save video</button>
        <button id="cancelButton" type="button" class="secondary hidden">Cancel edit</button>
      </form>
      <p id="formStatus" class="status" role="status"></p>
    </div>

    <div class="panel">
      <div class="top">
        <h2>Saved projects</h2>
        <button id="refreshButton" class="secondary" type="button">Refresh</button>
      </div>
      <div id="videoList">Loading projects...</div>
      <p id="listStatus" class="status" role="status"></p>
    </div>
  </section>
</main>

<script>
(() => {
  "use strict";

  // Replace these two values with your Supabase project details.
  const SUPABASE_URL = "https://ibpditpbprwviuveplnt.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_pQEAReBcARVo1_kwEXwNwQ_LlZ0T6Vj";

  const $ = id => document.getElementById(id);
  const loginPanel = $("loginPanel");
  const dashboard = $("dashboard");

  if (
    !SUPABASE_URL.startsWith("https://") ||
    SUPABASE_URL.includes("YOUR_SUPABASE") ||
    SUPABASE_PUBLISHABLE_KEY.includes("YOUR_SUPABASE")
  ) {
    $("loginStatus").textContent =
      "Setup required: add your Supabase Project URL and Publishable key in admin.html.";
    $("loginButton").disabled = true;
    return;
  }

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    }
  );

  let busy = false;

  function setStatus(id, message) {
    $(id).textContent = message || "";
  }

  function setBusy(value) {
    busy = value;
    document.querySelectorAll("button").forEach(button => {
      button.disabled = value;
    });
  }

  function validYouTubeUrl(value) {
    try {
      const url = new URL(value);
      if (url.protocol !== "https:") return false;
      const host = url.hostname.toLowerCase().replace(/^www\./, "");
      return (
        ["youtube.com", "m.youtube.com", "youtu.be"].includes(host) &&
        Boolean(url.pathname.replaceAll("/", ""))
      );
    } catch {
      return false;
    }
  }

  async function requireAdmin(user) {
    if (!user || user.app_metadata?.role !== "admin") {
      await db.auth.signOut();
      throw new Error(
        "This account is not authorized as an admin. Check the admin role in Supabase, then sign in again."
      );
    }
  }

  function showLogin() {
    loginPanel.classList.remove("hidden");
    dashboard.classList.add("hidden");
  }

  async function showDashboard(user) {
    await requireAdmin(user);
    $("adminEmail").textContent = user.email || "Admin";
    loginPanel.classList.add("hidden");
    dashboard.classList.remove("hidden");
    await loadVideos();
  }

  function resetForm() {
    $("videoForm").reset();
    $("videoId").value = "";
    $("formHeading").textContent = "Add a video";
    $("saveButton").textContent = "Save video";
    $("cancelButton").classList.add("hidden");
    setStatus("formStatus", "");
  }

  function editVideo(video) {
    $("videoId").value = video.id;
    $("title").value = video.title || "";
    $("category").value = video.category || "other";
    $("youtubeUrl").value = video.youtube_url || "";
    $("formHeading").textContent = "Edit video";
    $("saveButton").textContent = "Save changes";
    $("cancelButton").classList.remove("hidden");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  async function loadVideos() {
    setStatus("listStatus", "Loading projects...");
    $("videoList").replaceChildren();

    const { data, error } = await db
      .from("portfolio_videos")
      .select("id,title,category,youtube_url,created_at")
      .order("created_at", { ascending: false });

    if (error) {
      setStatus("listStatus", "Could not load projects: " + error.message);
      return;
    }

    if (!data || data.length === 0) {
      $("videoList").textContent = "No projects yet. Add your first video above.";
      setStatus("listStatus", "");
      return;
    }

    data.forEach(video => {
      const item = document.createElement("div");
      item.className = "video";

      const heading = document.createElement("strong");
      heading.textContent = video.title || "Untitled project";

      const details = document.createElement("p");
      details.className = "muted";
      details.textContent = (video.category || "other") + " · " + (video.youtube_url || "");

      const edit = document.createElement("button");
      edit.type = "button";
      edit.className = "secondary";
      edit.textContent = "Edit";
      edit.addEventListener("click", () => editVideo(video));

      const remove = document.createElement("button");
      remove.type = "button";
      remove.className = "danger";
      remove.textContent = "Delete";
      remove.addEventListener("click", async () => {
        if (busy || !confirm("Delete this project?")) return;
        setBusy(true);
        try {
          const { error } = await db
            .from("portfolio_videos")
            .delete()
            .eq("id", video.id);
          if (error) throw error;
          resetForm();
          await loadVideos();
          setStatus("listStatus", "Project deleted.");
        } catch (error) {
          setStatus("listStatus", "Delete failed: " + error.message);
        } finally {
          setBusy(false);
        }
      });

      item.append(heading, details, edit, remove);
      $("videoList").append(item);
    });

    setStatus("listStatus", "Projects loaded: " + data.length);
  }

  $("loginForm").addEventListener("submit", async event => {
    event.preventDefault();
    if (busy) return;
    setBusy(true);
    setStatus("loginStatus", "Signing in...");

    try {
      const { data, error } = await db.auth.signInWithPassword({
        email: $("email").value.trim(),
        password: $("password").value
      });
      if (error) throw error;
      await showDashboard(data.user);
      setStatus("loginStatus", "");
    } catch (error) {
      showLogin();
      setStatus("loginStatus", "Login failed: " + error.message);
    } finally {
      $("password").value = "";
      setBusy(false);
    }
  });

  $("videoForm").addEventListener("submit", async event => {
    event.preventDefault();
    if (busy) return;

    const title = $("title").value.trim();
    const category = $("category").value;
    const youtube_url = $("youtubeUrl").value.trim();
    const id = $("videoId").value;

    if (!validYouTubeUrl(youtube_url)) {
      setStatus("formStatus", "Enter a valid HTTPS YouTube video link.");
      return;
    }

    setBusy(true);
    setStatus("formStatus", "Saving project...");

    try {
      const { data: sessionData } = await db.auth.getSession();
      if (!sessionData.session) throw new Error("Please sign in again.");

      const { error } = id
        ? await db.from("portfolio_videos")
            .update({ title, category, youtube_url }).eq("id", id)
        : await db.from("portfolio_videos")
            .insert([{ title, category, youtube_url }]);

      if (error) throw error;

      resetForm();
      await loadVideos();
      setStatus("formStatus", "Project saved successfully.");
    } catch (error) {
      setStatus("formStatus", "Save failed: " + error.message);
    } finally {
      setBusy(false);
    }
  });

  $("cancelButton").addEventListener("click", resetForm);
  $("refreshButton").addEventListener("click", loadVideos);

  $("logoutButton").addEventListener("click", async () => {
    setBusy(true);
    try {
      const { error } = await db.auth.signOut();
      if (error) throw error;
      showLogin();
      setStatus("loginStatus", "You have logged out.");
      resetForm();
    } catch (error) {
      setStatus("listStatus", "Logout failed: " + error.message);
    } finally {
      setBusy(false);
    }
  });

  async function init() {
    try {
      const { data, error } = await db.auth.getSession();
      if (error) throw error;
      if (data.session) {
        await showDashboard(data.session.user);
      } else {
        showLogin();
      }
    } catch (error) {
      showLogin();
      setStatus("loginStatus", "Setup error: " + error.message);
    }
  }

  db.auth.onAuthStateChange((event, session) => {
    if (event === "SIGNED_OUT" || !session) showLogin();
  });

  init();
})();
</script>
</body>
</html>
